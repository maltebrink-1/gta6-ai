# Visual themes. Each video picks one (seeded by the script id, and never the
# same theme twice in a row), so the channel looks varied but consistent.
# All art is generated by code — no game footage, logos or key art is used.

themes:
  sunset_drive:
    palette:
      sky_top: "#1b0a33"
      sky_bottom: "#ff5e7e"
      glow: "#ffb347"
      accent: "#ffd23f"
      accent2: "#3df5ff"
      card: "#140726"
    backgrounds: [synth_sun, palms, waves]
    font: Anton
    transitions: [slideup, smoothup, circleopen, fade]

  neon_night:
    palette:
      sky_top: "#05010f"
      sky_bottom: "#2a0b52"
      glow: "#ff2bd6"
      accent: "#39ff88"
      accent2: "#ff2bd6"
      card: "#0b0420"
    backgrounds: [bokeh_city, streaks, synth_sun]
    font: Archivo Black
    transitions: [radial, slideleft, zoomin, fade]

  ocean_breeze:
    palette:
      sky_top: "#03203a"
      sky_bottom: "#11b5c9"
      glow: "#9ff7ff"
      accent: "#ffe66d"
      accent2: "#ff6f91"
      card: "#032135"
    backgrounds: [waves, palms, bokeh_city]
    font: Bebas Neue
    transitions: [wipeleft, smoothup, circleopen, dissolve]

  wanted_level:
    palette:
      sky_top: "#07070d"
      sky_bottom: "#1d1030"
      glow: "#ff3b3b"
      accent: "#ffcf33"
      accent2: "#3b7bff"
      card: "#0d0d18"
    backgrounds: [police, streaks, bokeh_city]
    font: Bangers
    transitions: [slideup, hblur, zoomin, fade]

  swamp_glow:
    palette:
      sky_top: "#04140c"
      sky_bottom: "#1f6b3a"
      glow: "#c6ff4a"
      accent: "#c6ff4a"
      accent2: "#ff9f1c"
      card: "#06180f"
    backgrounds: [bokeh_city, waves, palms]
    font: Luckiest Guy
    transitions: [circleopen, slideleft, dissolve, smoothup]
