# Licensed background music (optional).
#
# By default every video uses ORIGINAL music generated by code (music.source: generated),
# which the channel owns outright. Only add tracks here if you have permission to use them
# on BOTH YouTube and TikTok, then set music.source: library in config/settings.yaml.
#
# A track is ignored unless ALL of these fields are filled in and the file exists:
#   file, title, artist, license, source_url   (attribution: required text if the licence needs credit)
#
# Example:
# tracks:
#   - file: my-track.mp3
#     title: "Track title"
#     artist: "Artist name"
#     license: "CC BY 4.0"
#     source_url: "https://example.com/track-page"
#     attribution: "Music: Track title by Artist name (CC BY 4.0)"
tracks: []
