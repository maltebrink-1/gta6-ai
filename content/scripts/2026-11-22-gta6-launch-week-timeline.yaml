  facts: [gta6_release_date, gta6_metacritic_99]
  card: {type: date, big: NOV 19, small: LAUNCH DAY}
- text: The very next day, Take-Two said it hit $3.79 billion in retail sales on day one.
  kind: claim
  facts: [gta6_day_one_sales]
  card: {type: stat, big: $3.79B, small: DAY ONE · PER TAKE-TWO}
- text: December 10th. The Game Awards reveal their winners live.
  kind: claim
  facts: [gta6_game_awards_2026]
  card: {type: date, big: DEC 10, small: THE GAME AWARDS}
- text: And December 11th, Rockstar says the original score by Justice drops, with 30 tracks.
  kind: claim
