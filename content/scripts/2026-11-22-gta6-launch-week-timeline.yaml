- text: GTA 6's launch window is stacked. Here it is, date by date.
  kind: hook
- text: November 17th. The Game Awards announced its nominees, and GTA 6 got eight, the most of any game.
  kind: claim
  facts: [gta6_game_awards_2026]
  card: {type: date, big: NOV 17, small: EIGHT NOMINATIONS}
- text: November 19th. GTA 6 launched, holding a 99 on Metacritic.
