lines:
- text: GTA 6 just got its first patch. Here's what it actually fixes.
  kind: hook
  facts: [gta6_first_patch]
- text: When did it land? It started rolling out on November 23rd, on PS5 and Xbox Series X and S.
  kind: claim
  facts: [gta6_first_patch]
  card: {type: stat, big: 01.002.002, small: FIRST POST-LAUNCH UPDATE}
- text: Is the weather fixed? Rockstar's patch notes list a fix for weather that stopped changing for long periods.
  kind: claim
  facts: [gta6_first_patch]
- text: What about saving? The notes also fix autosave not working correctly.
  kind: claim
  facts: [gta6_first_patch]
- text: Stuck with the cops forever? There's a fix for players being unable to lose their Wanted Level.
  kind: claim
  facts: [gta6_first_patch]
  card: {type: text, big: WANTED LEVEL, small: FIXED IN THE PATCH}
- text: Anything else? Fixes for several crash issues, plus phone calls that failed to trigger.
  kind: claim
  facts: [gta6_first_patch]
- text: Quick fixes like these are a good sign for the months ahead.
  kind: opinion
- text: Did the patch fix your game? Tell me below and follow for more GTA 6 updates.
  kind: cta
description: GTA 6's first post-launch update, 01.002.002, is rolling out on PS5 and Xbox Series X|S. Here's what Rockstar's patch notes say it fixes.
