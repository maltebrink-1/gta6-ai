# Publishing. Triggered when YOU add the label "approved" or "rejected" to a
# review issue (the decision is recorded; approved videos are uploaded at the
# daily 13:00 publish run). Uploads only happen if config/settings.yaml has
# publishing.enabled: true AND the platform is enabled AND its secrets exist.
name: Publish

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 11 * * *"   # 13:00 Copenhagen in summer (UTC+2)
    - cron: "0 12 * * *"   # 13:00 Copenhagen in winter (UTC+1)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  review-decision:
    # Only the repository owner's labels count — strangers can't trigger anything.
    if: >
      github.event_name == 'issues' &&
      (github.event.label.name == 'approved' || github.event.label.name == 'rejected') &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          voice-model: "false"
          media-tools: "false"
      - name: Apply decision (and publish if allowed)
        run: python -m gta6shorts review-label --issue "${{ github.event.issue.number }}" --label "${{ github.event.label.name }}"
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "publish: decision on #${{ github.event.issue.number }}"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1

  timecheck:
    # Only the UTC slot that is 13:00 in Copenhagen today runs (+01 winter, +02 summer).
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.t.outputs.go }}
    steps:
      - id: t
        run: |
          if [ "$(TZ=Europe/Copenhagen date +%z)" = "+0200" ]; then want="0 11 * * *"; else want="0 12 * * *"; fi
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Other daylight-saving slot — skipping."
          fi

  publish-pending:
    needs: timecheck
    if: needs.timecheck.outputs.go == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.AUTOMATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          voice-model: "false"
          media-tools: "false"
      - name: Publish approved videos (all QA-passed videos in auto mode)
        run: python -m gta6shorts publish-pending
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "publish: $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
