# Daily statistics, report and dashboard (GitHub Pages).
name: Stats & dashboard

on:
  schedule:
    - cron: "43 21 * * *"   # 21:43 UTC daily
  workflow_dispatch:
    inputs:
      demo:
        description: Build the dashboard with clearly-labelled demo numbers
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  stats:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          voice-model: "false"
          media-tools: "false"
      - name: Check secrets format (values stay hidden)
        run: python -m gta6shorts doctor
      - name: Collect statistics
        run: python -m gta6shorts stats
      - name: Build daily report and dashboard
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then python -m gta6shorts report --demo; else python -m gta6shorts report; fi
      - name: Save stats and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "stats: $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-dashboard:
    # Needs a one-time click: Settings → Pages → Source: "GitHub Actions".
    needs: stats
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: echo "Dashboard → ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
