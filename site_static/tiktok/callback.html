<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok connected — Shorts uploader</title><style>body{font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:0 auto;padding:24px 16px;color:#111;background:#fafaf8}h1{font-size:26px}h2{font-size:18px;margin-top:28px}code{background:#eee;padding:2px 6px;border-radius:4px;word-break:break-all}a{color:#2a78d6}.box{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:16px 0}button{font:inherit;padding:10px 16px;border-radius:10px;border:0;background:#111;color:#fff;cursor:pointer}@media (prefers-color-scheme:dark){body{background:#111;color:#eee}.box{background:#1b1b1b;border-color:#333}code{background:#2a2a2a}button{background:#eee;color:#111}}</style></head><body>
<h1>TikTok</h1><div class="box" id="out">Reading the answer from TikTok…</div>
<p><a href="./">Back</a> · <a href="../privacy.html">Privacy Policy</a> · <a href="../terms.html">Terms of Service</a></p>
<script>
(function(){
  var q = new URLSearchParams(location.search), out = document.getElementById("out");
  out.textContent = "";
  if (q.get("error")) { out.appendChild(document.createTextNode("TikTok returned an error: " + q.get("error") + " " + (q.get("error_description") || ""))); return; }
  var code = q.get("code");
  if (!code) { out.textContent = "No authorization code in this link."; return; }
  var h = document.createElement("p"); h.textContent = "✅ Connected. Copy this one-time code and run the “Connect TikTok” workflow with it within a few minutes:"; out.appendChild(h);

})();
</script></body></html>
